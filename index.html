                            </div>
                        </button>

                            <span class="text-3xl group-hover:scale-110 transition-transform">❤️</span>

                                <h3 class="font-bold text-red-900 text-sm">복습 & 오답노트</h3>

                            <span class="text-3xl group-hover:scale-110 transition-transform">🎁</span>
                            <div>
                                <h3 class="font-bold text-indigo-900 text-sm">스티커 도감</h3>
                                <p class="text-[11px] text-indigo-500 mt-0.5">모은 별로 스티커 수집</p>
                            </div>
                        </button>
                    </div>

                    <!-- Daily Learning Tip Banner -->
                    <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3.5 flex items-center space-x-3 shadow-sm">

                        <p class="text-xs text-amber-900 leading-snug">

        }

        // --- 2. FLASH CARD LEARNING ---
        function renderCardLearning() {
            const item = hanjaList[currentCardIndex];
            const main = document.getElementById('main-content');
            isCardFlipped = false;

            main.innerHTML = `
                <div class="flex flex-col items-center justify-between min-h-[580px] space-y-4">
                    <div class="flex justify-between w-full items-center text-xs font-bold text-purple-600 px-1">
                        <div class="flex items-center space-x-1.5">
                            <span class="bg-gradient-to-r from-pink-500 to-purple-500 text-white px-2 py-0.5 rounded-md text-[10px] font-black">${item.grade}</span>
                            <span>카드 (${currentCardIndex + 1} / ${hanjaList.length})</span>
                        </div>
                        <span class="bg-purple-100 px-2.5 py-1 rounded-full text-purple-700 font-semibold">${item.memorized ? '✅ 외웠어요' : '⏳ 학습중'}</span>
                    </div>

                    <!-- Interactive Flip Card -->
                    <div onclick="flipCard()" class="w-full h-80 perspective-1000 cursor-pointer">
                        <div id="card-inner" class="relative w-full h-full transform-style-3d transition-transform duration-500 shadow-xl rounded-3xl border-2 border-purple-200 bg-white">
                            <!-- Front Side -->
                            <div class="absolute inset-0 backface-hidden flex flex-col items-center justify-center p-6 bg-gradient-to-b from-white via-purple-50/30 to-purple-100/40 rounded-3xl">
                                <span class="text-xs text-purple-400 font-semibold mb-1 bg-purple-100/60 px-3 py-1 rounded-full">👆 터치해서 뒤집기</span>
                                <span class="text-8xl font-serif font-bold text-gray-800 my-2">${item.char}</span>
                                <div class="flex space-x-2 items-center">
                                    <span class="text-[11px] text-pink-600 font-bold bg-pink-50 px-2.5 py-0.5 rounded-full border border-pink-100">${item.grade}</span>
                                    <span class="text-[11px] text-purple-600 font-medium bg-white px-2.5 py-0.5 rounded-full shadow-sm border border-purple-100">총 ${item.stroke}획</span>
                                </div>
                            </div>
                            <!-- Back Side -->
                            <div class="absolute inset-0 backface-hidden rotate-y-180 flex flex-col items-center justify-between p-6 bg-gradient-to-b from-purple-600 to-indigo-600 text-white rounded-3xl">
                                <div class="text-center w-full">
                                    <span class="text-xs bg-white/20 text-yellow-200 px-2.5 py-0.5 rounded-full font-bold">${item.grade} 배정 한자</span>
                                    <span class="text-3xl font-bold font-cute text-yellow-300 block my-1">${item.hun}</span>
                                    <div class="w-12 h-0.5 bg-purple-300/50 mx-auto my-1.5"></div>
                                </div>
                                <div class="w-full space-y-2">
                                    <div class="bg-purple-700/60 p-2.5 rounded-xl border border-purple-400/30 text-center">
                                        <p class="text-[10px] text-purple-200 font-semibold mb-0.5">💡 연상 기억 팁</p>
                                        <p class="text-xs font-bold text-yellow-100">${item.tip}</p>
                                    </div>
                                    <div class="bg-purple-800/60 p-2.5 rounded-xl border border-purple-400/30 text-center">
                                        <p class="text-[10px] text-purple-200 font-semibold mb-0.5">📚 활용 예시 단어</p>
                                        <p class="text-xs font-bold text-white">${item.example}</p>
                                    </div>
                                </div>
                                <span class="text-[11px] text-purple-200">다시 터치하면 앞면으로 이동합니다</span>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="w-full space-y-2.5">
                        <div class="grid grid-cols-2 gap-3 w-full">
                            <button onclick="markCard(false)" class="py-3 bg-red-50 border border-red-200 hover:bg-red-100 text-red-600 font-bold rounded-2xl text-xs sm:text-sm transition-all active:scale-95 flex items-center justify-center space-x-1 shadow-sm">
                                <span>😅 아직 어려워요</span>
                            </button>
                            <button onclick="markCard(true)" class="py-3 bg-emerald-50 border border-emerald-200 hover:bg-emerald-100 text-emerald-700 font-bold rounded-2xl text-xs sm:text-sm transition-all active:scale-95 flex items-center justify-center space-x-1 shadow-sm">
                                <span>🎉 완벽히 외웠어요!</span>
                            </button>
                        </div>
                        <div class="flex justify-between w-full pt-1">
                            <button onclick="prevCard()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold rounded-xl text-xs transition-all" ${currentCardIndex === 0 ? 'disabled opacity-40' : ''}>← 이전 한자</button>
                            <button onclick="nextCard()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-xl text-xs transition-all shadow-sm">다음 한자 →</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 3. REAL EXAM MOCK QUIZ ---
        function renderQuizQuestion() {
            const q = examQuestions[currentQuizIndex];
            selectedOption = null;
            const main = document.getElementById('main-content');

            main.innerHTML = `
                <div class="space-y-4 animate-fade-in">
                    <!-- Quiz Progress -->
                    <div class="flex justify-between items-center text-xs font-bold text-purple-700">
                        <span class="bg-purple-100 px-3 py-1 rounded-full">실전 문제 ${currentQuizIndex + 1} / ${examQuestions.length}</span>
                        <div class="space-x-1">
                            <span class="text-white bg-purple-500 px-2 py-0.5 rounded-md text-[10px]">${q.grade}</span>
                            <span class="text-pink-500 bg-pink-50 px-2 py-0.5 rounded-full border border-pink-100 text-[11px]">${q.type}</span>
                        </div>
                    </div>

                    <!-- Question Container -->
                    <div class="bg-gradient-to-b from-purple-50 to-pink-50/30 p-5 rounded-3xl border border-purple-200 text-center shadow-sm relative">
                        <h3 class="text-xs font-bold text-gray-600 mb-3">${q.question}</h3>
                        <div class="text-gray-800 text-base my-2 leading-relaxed">${q.context}</div>
                    </div>

                    <!-- Options List -->
                    <div class="space-y-2.5">
                        ${q.options.map((opt, idx) => `
                            <button onclick="selectAnswer(${idx})" id="opt-${idx}" class="quiz-opt w-full text-left p-3.5 rounded-2xl border border-gray-200 text-sm font-semibold bg-white hover:bg-purple-50 transition-all active:scale-98 flex justify-between items-center shadow-sm">
                                <span><b>${idx + 1}.</b> ${opt}</span>
                                <span class="radio-icon text-gray-300">⚪</span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- Submit Button -->
                    <button onclick="submitQuizAnswer()" id="submit-btn" disabled class="w-full py-3.5 bg-gray-300 text-white font-bold rounded-2xl text-sm transition-all mt-4">
                        정답 제출하기
                    </button>
                </div>
            `;
        }

        // --- 4. WRONG NOTES / REVISE ---
        function renderWrongNotes() {
            const wrongItems = hanjaList.filter(h => !h.memorized);
            const main = document.getElementById('main-content');
            
            main.innerHTML = `
                <div class="space-y-4 animate-fade-in">
                    <div class="flex justify-between items-center">
                        <h3 class="text-base font-bold text-gray-800 flex items-center space-x-1">
                            <span>❤️</span> <span>복습이 필요한 한자</span>
                        </h3>
                        <span class="text-xs font-semibold text-purple-600 bg-purple-100 px-2.5 py-1 rounded-full">${wrongItems.length}개 남아있음</span>
                    </div>

                    <div class="space-y-2.5">
                        ${wrongItems.map(h => `
                            <div class="bg-white p-3.5 rounded-2xl border border-purple-100 flex justify-between items-center shadow-sm hover:shadow-md transition-all">
                                <div class="flex items-center space-x-3">
                                    <div class="relative">
                                        <span class="text-3xl font-serif font-bold text-purple-700 bg-purple-50 w-12 h-12 flex items-center justify-center rounded-xl">${h.char}</span>
                                        <span class="absolute -top-1 -left-1 bg-purple-600 text-white text-[8px] font-extrabold px-1.5 py-0.2 rounded-full">${h.grade}</span>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-sm text-gray-800">${h.hun}</h4>
                                        <p class="text-xs text-gray-400 mt-0.5">${h.example}</p>
                                    </div>
                                </div>
                                <button onclick="quickReview('${h.char}')" class="px-3.5 py-1.5 bg-purple-100 hover:bg-purple-200 text-purple-700 text-xs font-bold rounded-xl active:scale-95 transition-all">카드보기</button>
                            </div>
                        `).join('') || `
                            <div class="text-center py-12 space-y-2">
                                <span class="text-5xl">🎉</span>
                                <p class="text-sm font-bold text-purple-800">모든 한자를 다 외우셨어요!</p>
                                <p class="text-xs text-gray-400">실전 모의고사에서 실력을 검증해보세요.</p>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function quickReview(char) {
            const index = hanjaList.findIndex(h => h.char === char);
            if (index !== -1) {
                currentCardIndex = index;
                switchTab('cards');
            }
        }

        // --- 5. STICKER SHOP / COLLECTION ---
        function showStickerShop() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="space-y-4 animate-fade-in">
                    <div class="bg-gradient-to-r from-amber-400 to-orange-400 p-4 rounded-2xl text-white shadow-md flex justify-between items-center">
                        <div>
                            <h3 class="font-bold font-cute text-xl">스티커 수집 도감 🎁</h3>
                            <p class="text-[11px] opacity-90">퀴즈와 카드로 별을 모아 스티커를 잠금 해제하세요!</p>
                        </div>
                        <div class="bg-white/20 px-3 py-1.5 rounded-full text-sm font-bold text-yellow-100 border border-white/30">
                            ⭐ ${userStars}
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        ${stickerList.map(s => {
                            const isUnlocked = unlockedStickers.includes(s.id);
                            return `
                                <div class="bg-white border ${isUnlocked ? 'border-amber-300' : 'border-gray-200'} p-4 rounded-2xl text-center flex flex-col items-center justify-between shadow-sm relative overflow-hidden">
                                    <span class="text-5xl my-2 ${isUnlocked ? '' : 'filter grayscale opacity-40'}">${s.emoji}</span>
                                    <h4 class="font-bold text-xs text-gray-800">${s.name}</h4>
                                    ${isUnlocked ? 
                                        `<span class="mt-2 text-[10px] bg-amber-100 text-amber-700 font-bold px-2.5 py-0.5 rounded-full">보유 중</span>` :
                                        `<button onclick="unlockSticker(${s.id}, ${s.price})" class="mt-2 text-xs bg-gradient-to-r from-amber-400 to-orange-400 text-white font-bold px-3 py-1 rounded-xl shadow-sm active:scale-95">⭐ ${s.price}개로 해제</button>`
                                    }
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function unlockSticker(id, price) {
            if (userStars >= price) {
                userStars -= price;
                unlockedStickers.push(id);
                updateHeader();
                confetti({ particleCount: 60, spread: 80, origin: { y: 0.5 } });
                showStickerShop();
            } else {
                showModal('⭐ 별이 부족해요!', `스티커를 얻으려면 퀴즈나 학습을 통해 별을 더 모아주세요!<br>(필요한 별: ⭐ ${price}개)`, null);
            }
        }

        // --- UTILS: CUSTOM MODAL SYSTEM ---
        function showModal(title, content, callback) {
            const modal = document.getElementById('modal');
            const body = document.getElementById('modal-body');
            
            body.innerHTML = `
                <h3 class="text-xl font-bold text-purple-900 font-cute">${title}</h3>
                <div class="my-3 text-xs sm:text-sm text-gray-700 leading-relaxed">${content}</div>
                <button id="modal-confirm-btn" class="w-full py-2.5 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold rounded-xl text-xs mt-2 shadow-md hover:opacity-95 active:scale-95 transition-all">확인</button>
            `;

            modal.classList.remove('hidden');
            setTimeout(() => {
                body.classList.remove('scale-95', 'opacity-0');
                body.classList.add('scale-100', 'opacity-100');
            }, 10);

            document.getElementById('modal-confirm-btn').onclick = () => {
                body.classList.remove('scale-100', 'opacity-100');
                body.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    if (callback) callback();
                }, 150);
            };
        }
    </script>
</body>
