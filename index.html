    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;

        .perspective-1000 {
            perspective: 1000px;

        .transform-style-3d {

</head>
<body class="min-h-screen flex justify-center items-start sm:items-center p-0 sm:p-4">

    <!-- App Container -->

            <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center p-2 text-purple-600 font-bold transition-all">
                <span class="text-xl">🏠</span>

            </button>
            <button onclick="switchTab('cards')" id="nav-cards" class="nav-btn flex flex-col items-center p-2 text-gray-400 font-medium transition-all">
                <span class="text-xl">🎴</span>

            <button onclick="switchTab('quiz')" id="nav-quiz" class="nav-btn flex flex-col items-center p-2 text-gray-400 font-medium transition-all">

    </div>

        // Quiz State
        let currentQuizIndex = 0;
        let quizScore = 0;
        let selectedOption = null;

        // --- INITIALIZATION ---
        window.onload = () => {

        function updateHeader() {
            document.getElementById('header-stars').innerText = `⭐ ${userStars}`;

        // --- NAVIGATION CONTROLLER ---
        function switchTab(tab) {

            document.querySelectorAll('.nav-btn').forEach(btn => {

                btn.classList.add('text-gray-400', 'font-medium');

            if (tab === 'home') renderHome();
            else if (tab === 'cards') renderCardLearning();
            else if (tab === 'quiz') startQuiz();
            else if (tab === 'wrong') renderWrongNotes();
        }

                        <button onclick="switchTab('cards')" class="bg-gradient-to-br from-purple-50 to-pink-50 border border-purple-200 p-4 rounded-2xl text-left hover:shadow-md transition-all active:scale-95 flex flex-col justify-between h-32">
                            <span class="text-3xl">🎴</span>
                            <div>
                                <h3 class="font-bold text-purple-900 text-sm">한자 플래시카드</h3>
                                <p class="text-[11px] text-purple-500 mt-0.5">터치해서 훈음 확인하기</p>

                        </button>

                            <div>
                                <h3 class="font-bold text-yellow-900 text-sm">실전 모의고사</h3>

        function flipCard() {
            isCardFlipped = !isCardFlipped;
            const inner = document.getElementById('card-inner');
            if (isCardFlipped) {
                inner.classList.add('rotate-y-180');
            } else {
                inner.classList.remove('rotate-y-180');
            }
        }

        function markCard(status) {
            hanjaList[currentCardIndex].memorized = status;
            if (status) {
                userStars += 1;
                confetti({ particleCount: 30, spread: 60, origin: { y: 0.7 } });
            }
            updateHeader();
            nextCard();
        }

        function prevCard() {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                renderCardLearning();
            }
        }

        function nextCard() {
            if (currentCardIndex < hanjaList.length - 1) {
                currentCardIndex++;
                renderCardLearning();
            } else {
                showModal('👏 참 잘했어요!', '모든 한자 카드를 학습했습니다!', () => { switchTab('home'); });
            }
        }

        // --- 3. REAL EXAM MOCK QUIZ ---
        function startQuiz() {
            currentQuizIndex = 0;
            quizScore = 0;
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            const q = examQuestions[currentQuizIndex];
            selectedOption = null;
            const main = document.getElementById('main-content');

            main.innerHTML = `
                <div class="space-y-4">
                    <!-- Header Status -->
                    <div class="flex justify-between items-center text-xs font-bold text-purple-700">
                        <span class="bg-purple-100 px-3 py-1 rounded-full">실전 유형 ${currentQuizIndex + 1} / ${examQuestions.length}</span>
                        <span class="text-pink-500 font-semibold">유형: ${q.type}</span>
                    </div>

                    <!-- Question Box -->
                    <div class="bg-purple-50 p-4 rounded-2xl border border-purple-200 text-center shadow-sm">
                        <h3 class="text-xs font-bold text-gray-600 mb-2">${q.question}</h3>
                        <div class="text-gray-800 text-lg my-2">${q.context}</div>
                    </div>

                    <!-- Options -->
                    <div class="space-y-2.5">
                        ${q.options.map((opt, idx) => `
                            <button onclick="selectAnswer(${idx})" id="opt-${idx}" class="quiz-opt w-full text-left p-3.5 rounded-2xl border border-gray-200 text-sm font-semibold bg-white hover:bg-purple-50 transition-all active:scale-98 flex justify-between items-center">
                                <span>${idx + 1}. ${opt}</span>
                                <span class="radio-icon text-gray-300">⚪</span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- Submit Button -->
                    <button onclick="submitQuizAnswer()" id="submit-btn" disabled class="w-full py-3.5 bg-gray-300 text-white font-bold rounded-2xl text-sm transition-all mt-4">
                        정답 제출하기
                    </button>
                </div>
            `;
        }

        function selectAnswer(idx) {
            selectedOption = idx;
            document.querySelectorAll('.quiz-opt').forEach((btn, i) => {
                btn.classList.remove('border-purple-500', 'bg-purple-50', 'text-purple-700');
                btn.querySelector('.radio-icon').innerText = '⚪';
            });
            const selectedBtn = document.getElementById(`opt-${idx}`);
            selectedBtn.classList.add('border-purple-500', 'bg-purple-50', 'text-purple-700');
            selectedBtn.querySelector('.radio-icon').innerText = '🟣';

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = false;
            submitBtn.classList.remove('bg-gray-300');
            submitBtn.classList.add('bg-purple-600', 'hover:bg-purple-700', 'shadow-md');
        }

        function submitQuizAnswer() {
            const q = examQuestions[currentQuizIndex];
            const isCorrect = (selectedOption === q.answer);

            if (isCorrect) {
                quizScore++;
                userStars += 5;
                updateHeader();
                confetti({ particleCount: 50, spread: 70, origin: { y: 0.6 } });
                showModal('🎉 정답입니다!', `<p class="text-xs text-gray-600 mt-1">${q.comment}</p>`, nextQuizQuestion);
            } else {
                showModal('❌ 아쉬워요!', `<p class="text-xs text-red-500 mt-1">정답: ${q.answer + 1}번 (${q.options[q.answer]})</p><p class="text-xs text-gray-500 mt-2">${q.comment}</p>`, nextQuizQuestion);
            }
        }

        function nextQuizQuestion() {
            if (currentQuizIndex < examQuestions.length - 1) {
                currentQuizIndex++;
                renderQuizQuestion();
            } else {
                // Finish Quiz
                showModal('🏆 시험 종료!', `수고하셨습니다!<br>총 ${examQuestions.length}문제 중 <b>${quizScore}문제</b>를 맞혔습니다!`, () => {
                    switchTab('home');
                });
            }
        }

        // --- 4. WRONG NOTES / STICKERS ---
        function renderWrongNotes() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="space-y-4">
                    <h3 class="text-base font-bold text-gray-800 flex items-center space-x-1">
                        <span>❤️</span> <span>복습이 필요한 한자</span>
                    </h3>
                    <div class="space-y-2">
                        ${hanjaList.filter(h => !h.memorized).map(h => `
                            <div class="bg-white p-3 rounded-2xl border border-gray-100 flex justify-between items-center shadow-sm">
                                <div class="flex items-center space-x-3">
                                    <span class="text-3xl font-serif font-bold text-purple-700">${h.char}</span>
                                    <div>
                                        <h4 class="font-bold text-sm text-gray-800">${h.hun}</h4>
                                        <p class="text-xs text-gray-400">${h.example}</p>
                                    </div>
                                </div>
                                <button onclick="quickReview('${h.char}')" class="px-3 py-1.5 bg-purple-100 text-purple-600 text-xs font-bold rounded-xl">복습</button>
                            </div>
                        `).join('') || '<p class="text-xs text-center text-gray-400 py-8">모든 한자를 다 외웠어요! 대단해요! 👏</p>'}
                    </div>
                </div>
            `;
        }

        function quickReview(char) {
            const index = hanjaList.findIndex(h => h.char === char);
            if (index !== -1) {
                currentCardIndex = index;
                switchTab('cards');
            }
        }

        function showStickerShop() {
            showModal('🎁 스티커 보관함', `현재 모은 별: <b>⭐ ${userStars}개</b><br><br><div class="text-3xl space-x-2">🦄 👑 🌸 🐥 🍧</div><p class="text-xs text-gray-400 mt-3">열심히 퀴즈를 풀고 별을 모아 새 스티커를 모아보세요!</p>`, null);
        }

        // --- UTILS: MODAL SYSTEM ---
        function showModal(title, content, callback) {
            const modal = document.getElementById('modal');
            const body = document.getElementById('modal-body');
            
            body.innerHTML = `
                <h3 class="text-lg font-bold text-purple-900 font-cute text-xl">${title}</h3>
                <div class="my-3 text-sm text-gray-700">${content}</div>
                <button id="modal-confirm-btn" class="w-full py-2.5 bg-purple-600 text-white font-bold rounded-xl text-xs mt-2 shadow-md">확인</button>
            `;

            modal.classList.remove('hidden');
            setTimeout(() => {
                body.classList.remove('scale-95', 'opacity-0');
                body.classList.add('scale-100', 'opacity-100');
            }, 10);

            document.getElementById('modal-confirm-btn').onclick = () => {
                body.classList.remove('scale-100', 'opacity-100');
                body.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    if (callback) callback();
                }, 150);
            };
        }
    </script>
</body>
</html>
